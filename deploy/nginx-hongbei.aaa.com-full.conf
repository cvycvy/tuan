# ============================================================
# 完整独立模板（不依赖宝塔管理，可直接放 /www/server/panel/vhost/nginx/hongbei.aaa.com.conf）
# 仅当你要脱离宝塔完全手动配置 Nginx 时使用；否则用 nginx-hongbei.aaa.com.conf 粘贴片段
#
# 证书路径假设（宝塔 Let's Encrypt 默认位置）：
#   /www/server/panel/vhost/cert/hongbei.aaa.com/fullchain.pem
#   /www/server/panel/vhost/cert/hongbei.aaa.com/privkey.pem
# ============================================================

# --- HTTP: Let's Encrypt 文件验证 + 强制跳转 HTTPS ---
server {
    listen 80;
    server_name hongbei.aaa.com;

    # Let's Encrypt 文件验证必须在 80 端口可达
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/hongbei/dist-web;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/hongbei-aaa.http.log;
}

# --- HTTPS: 静态 H5 + /api 反代到 NestJS ---
server {
    listen 443 ssl http2;
    server_name hongbei.aaa.com;

    # 证书路径（宝塔申请成功后会写入此目录）
    ssl_certificate     /www/server/panel/vhost/cert/hongbei.aaa.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/hongbei.aaa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ⚠️ HSTS 注释状态：证书异常时会导致站点完全不可访问
    #    确认自动续签正常后再开启：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 基础路径 ----
    root /www/wwwroot/hongbei/dist-web;
    index index.html;
    client_max_body_size 20m;

    # ---- gzip ----
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 后端 API 反向代理 ----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- 带 hash 静态资源长缓存 ----
    location ^~ /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- 入口文件禁缓存 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- 前端路由兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 禁止敏感文件 ----
    location ~ /\.(env|git|svn) {
        deny all;
    }

    access_log /www/wwwlogs/hongbei-aaa.log;
    error_log  /www/wwwlogs/hongbei-aaa.error.log;
}
