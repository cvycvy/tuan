# ============================================================
# 宝塔 Nginx 配置 —— 烘焙协助（HTTPS + /api 反向代理）
#
# 【推荐做法：分两步，不要整文件覆盖】
#   宝塔会自己管理 listen / server_name / SSL 证书 / 强制HTTPS 这几段，
#   整文件覆盖会导致证书申请失败或被宝塔重写。
#
#   第 1 步：按 PART 1 把 location 片段粘贴进宝塔生成的站点配置文件
#   第 2 步：在宝塔 UI 申请 Let's Encrypt 证书并开启「强制 HTTPS」
#           （宝塔会自动补上 PART 2 里的 SSL 段，无需手写）
#
#   站点配置文件位置：/www/server/panel/vhost/nginx/你的域名.conf
#   仅当你需要脱离宝塔手动配置 HTTPS 时，才使用 PART 3 的完整模板。
# ============================================================


# ══════════════════════════════════════════════════════════
# PART 1 —— 粘贴进宝塔站点配置 server{} 内的片段（核心）
# 粘贴位置：宝塔「网站 → 设置 → 配置文件」，放在 root/index 之后、
#           宝塔自动生成的 #CERT-APPLY-CHECK 与 location ~ /\.ht 之前
# ══════════════════════════════════════════════════════════

    # H5 静态产物目录（宝塔站点根目录若已设为此路径，可省略 root 行）
    root /www/wwwroot/hongbei/dist-web;
    index index.html;

    # 上传体积上限（图片/凭证等，按需调整）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 后端 API 反向代理 → 本机 PM2 守护的 NestJS ----
    # 注意：3000 端口不要在安全组对外开放，只允许本机 Nginx 访问
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 微信支付/支付宝回调也走此规则，无需单独配置
    }

    # ---- 带 hash 的静态资源长缓存（Taro H5 产物为 /js /css 下带 hash 文件名）----
    location ^~ /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- 入口文件禁止缓存：否则发版后旧 index.html 引用已删除的 hash 资源会白屏 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- 前端路由兜底（hash 路由 #/pages/... 的保险，防深链 404）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 禁止访问敏感文件（.env / .git）----
    location ~ /\.(env|git|svn) {
        deny all;
    }


# ══════════════════════════════════════════════════════════
# PART 2 —— 宝塔申请证书后自动生成/写入的内容（了解即可，不用手抄）
# 手动申请证书时宝塔写入的关键行如下，可用来核对是否配置成功：
#
#   listen 443 ssl http2;
#   ssl_certificate     /www/server/panel/vhost/cert/你的域名/fullchain.pem;
#   ssl_certificate_key /www/server/panel/vhost/cert/你的域名/privkey.pem;
#   ssl_protocols       TLSv1.2 TLSv1.3;      # 微信小程序要求 ≥ TLS 1.2
#   # 强制 HTTPS（宝塔开关会生成）：
#   if ($server_protocol !~ "^HTTP/2") { ... }  # 或 rewrite ^/(.*)$ https://$host/$1 permanent;
# ══════════════════════════════════════════════════════════


