# ============================================================
# 宝塔可粘贴片段（站点 server{} 内使用）
# 域名 hongbei.aaa.com  |  根目录 /www/wwwroot/hongbei/dist-web  |  后端 127.0.0.1:3000
#
# 使用方法：
#   1. 宝塔「网站 → 添加站点」：域名 hongbei.aaa.com，根目录 /www/wwwroot/hongbei/dist-web，PHP=纯静态，不建数据库
#   2. 站点「设置 → 配置文件」，清空或替换整个 server{} 里除 listen / server_name / SSL 外的内容
#   3. 粘贴本文件全文
#   4. 保存后宝塔会自动 reload Nginx；终端 nginx -t 应通过
#   5. 站点「设置 → SSL → Let's Encrypt」申请证书 + 开启「强制 HTTPS」
# ============================================================

    # ---- 基础路径 ----
    root /www/wwwroot/hongbei/dist-web;
    index index.html;
    client_max_body_size 20m;

    # ---- gzip ----
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 后端 API 反向代理（支付回调 /api/purchase/callback/* 同走此规则）----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- 带 hash 静态资源长缓存（Taro H5 产物 /js /css）----
    location ^~ /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- 入口文件禁缓存，防止发版后旧 index.html 引用已删除的 hash 资源导致白屏 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- 前端路由兜底（hash 路由 #/pages/... 保险）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 禁止访问敏感文件 ----
    location ~ /\.(env|git|svn) {
        deny all;
    }

    access_log /www/wwwlogs/hongbei-aaa.log;
    error_log  /www/wwwlogs/hongbei-aaa.error.log;
